# THEME — bridge to themer
[commands.theme]
enabled = true
bin = "themer"
# THEME

# KB — keyboard layout; layouts are DETECTED from the session (mango config,
# Hyprland/sway IPC, setxkbmap, localectl). Set them only to override.
[commands.kb]
enabled = true
# layouts = ["us", "bg"]
# KB

# SYSINFO — the detail behind the waybar numbers (on-click target)
[commands.sysinfo]
enabled = true
lines = 25
# SYSINFO

# UPDATES
[commands.updates]
enabled = true
list_cmd = "zypper -q lu"
update_cmd = "sudo zypper up"
# Runs before the update: a repository rebuilt since the last refresh serves
# a 404 for the version the cached metadata still names.
refresh_cmd = "sudo zypper ref -f"
# UPDATES

# USBMOUNT
[commands.usbmount]
enabled = true
# USBMOUNT

# AUDIOOUT
[commands.audioout]
enabled = true
# AUDIOOUT

# MAIL
[commands.mail]
enabled = true
status_cmd = "~/bin/mailstatus"
sync_cmd = "mbsync -a"
client_cmd = "neomutt"
# MAIL

# PASS — the unix password store; keyforge generates and audits
[commands.pass]
enabled = true
store = "~/.password-store"
type_delay_ms = 200
keyforge = "keyforge"
# PASS
