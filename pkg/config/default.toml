# ql configuration file

# DEFAULTS
default_launcher = "auto"
menu_style = "grouped"    # flat, grouped

pdf_viewer = "zathura"
browser = "qutebrowser"
editor = "nvim"
man_viewer = "nvimpager"
# DEFAULTS

# MODULE GROUPS DISPLAY ORDER (grouped menu)
module_groups_order = ["system", "network", "media", "info", "secrets"]
# MODULE GROUPS DISPLAY ORDER (grouped menu)

# MODULE EXECUTION ORDER (flat menu)
module_order = [
    "power",
    "kill",
    "usbmount",
    "sysinfo",
    "updates",
    "theme",
    "kb",
    "audioout",
    "mail",
    "pass",
    "clipboard",
    "screenshot",
    "wifi",
    "bookman",
    "netstat",
    "radio",
    "mpc",
    "audiorecord",
    "videorecord",
    "weather",
    "man",
]
# MODULE EXECUTION ORDER (flat menu)

# THEME — the built-in Bubble Tea menu's look. `name` is a built-in preset
# ("default", "mono") or a file in ~/.config/ql/themes/<name>.yaml. The palette
# (nine roles: accent, accent_alt, text, muted, subtle, success, warning, error,
# title_fg) lives in that YAML file; `border` and `icons` override structure.
[theme]
name = "default"        # default, mono, or a themes/<name>.yaml file
# border = "rounded"    # rounded, normal, thick, double, hidden, none
# icons = "unicode"     # unicode, ascii
# THEME

# NOTIFICATION
[notifications]
enabled = true
tool = "auto"
timeout = 5000
urgency = "normal"
show_in_terminal = false
# NOTIFICATION

# LAUNCHERS
#
# The prompt flag is NOT configured here — each backend appends its own
# (-p / --prompt) after these args. Listing it here too produced argv like
# `dmenu -i -p -p ql` and an fzf --prompt that swallowed --height=40%.
[launchers.rofi]
args = ["-dmenu", "-i"]

[launchers.dmenu]
args = ["-i"]

[launchers.fzf]
args = ["--height=40%", "--reverse"]

[launchers.bemenu]
args = ["-i"]

[launchers.fuzzel]
args = ["--dmenu"]

# The built-in Bubble Tea menu takes no external arguments.
[launchers.tui]
args = []
# LAUNCHERS

###                                                     MODULE GROUP SYSTEM

[module_groups.system]
name = "System"
enabled = true
modules = ["power", "kill", "clipboard", "screenshot", "usbmount", "sysinfo", "updates", "theme", "kb"]

# POWER
[commands.power]
enabled = true
show_logout = true
show_suspend = true
show_hibernate = false
show_reboot = true
show_shutdown = true
confirm_logout = false
confirm_suspend = false
confirm_hibernate = true
confirm_reboot = true
confirm_shutdown = true
logout_command = "loginctl terminate-user $USER"
suspend_command = "systemctl suspend"
hibernate_command = "systemctl hibernate"
reboot_command = "systemctl reboot"
shutdown_command = "systemctl poweroff"
# POWER


# KILL
[commands.kill]
enabled = true
show_all_processes = false
exclude_processes = ["systemd", "init", "kthreadd"]
confirm_kill = true
# KILL

# CLIPBOARD
[commands.clipboard]
enabled = true
max_items = 50
# CLIPBOARD

# SCREENSHOT
[commands.screenshot]
enabled = true
save_dir = "~/Pictures/Screenshots"
file_prefix = "screenshot"
# SCREENSHOT

###                                                     MODULE GROUP SYSTEM

###                                                     MODULE GROUP NETWORK

[module_groups.network]
name = "Network"
enabled = true
modules = ["wifi", "bookman", "netstat", "mail"]

# WIFI
[commands.wifi]
enabled = true
show_notify = true
test_host = "1.1.1.1"
test_count = 3
test_wait = 2
# WIFI

# BOOKMAN
[commands.bookman]
enabled = true

[[commands.bookman.sources]]
name = "Qutebrowser Quickmarks"
path = "~/.config/qutebrowser/quickmarks"
format = "qutebrowser_quickmarks"

[[commands.bookman.sources]]
name = "Qutebrowser Bookmarks"
path = "~/.config/qutebrowser/bookmarks/urls"
format = "qutebrowser_bookmarks"

[[commands.bookman.sources]]
name = "Brave Bookmarks"
path = "~/.config/BraveSoftware/Brave-Browser/Default/Bookmarks"
format = "chrome_bookmarks_json"

[[commands.bookman.sources]]
name = "Firefox Bookmarks"
path = "~/.mozilla/firefox/ymhm1k99.default-esr78-1/places.sqlite"
format = "firefox_sqlite"
# BOOKMAN

# NETSTAT
[commands.netstat]
enabled = true
prefer_vnstat = true
# NETSTAT

###                                                     MODULE GROUP NETWORK

###                                                     MODULE GROUP MEDIA

[module_groups.media]
name = "Media"
enabled = true
modules = ["radio", "mpc", "audiorecord", "videorecord", "audioout"]

# RADIO
[commands.radio]
enabled = true
volume = 70
# RADIO

# MPC
[commands.mpc]
enabled = true
connection_type = "socket"
socket = "~/.local/state/mpd/socket"
host = "localhost"
port = "6600"
password = ""
current_playlist_cache = "~/.cache/ql/current_playlist"
# MPC

# AUDIO
[commands.audiorecord]
enabled = true
save_dir = "~/Music/Recordings"
file_prefix = "recording"
format = "mp3"
quality = "2"
# AUDIO

# VIDEO
[commands.videorecord]
enabled = true
save_dir = "~/Videos/Recordings"
file_prefix = "screencast"
format = "mp4"
quality = "23"
record_audio = true
show_notify = true

[commands.videorecord.wayland]
video_codec = "libx264"
audio_codec = "aac"
preset = "fast"
framerate = 30

[commands.videorecord.x11]
video_codec = "libx264"
audio_codec = "aac"
preset = "fast"
framerate = 30
output_fps = 30
# VIDEO

###                                                     MODULE GROUP MEDIA

###                                                     MODULE GROUP INFO
#
[module_groups.info]
name = "Info"
enabled = true
modules = ["weather", "man"]

# WEATHER
[commands.weather]
enabled = true
locations = ["Sofia", "London", "New York"]
options = ""
timeout = 30
# WEATHER

# MAN
[commands.man]
enabled = true
show_descriptions = true
max_results = 100
# MAN

###                                                     MODULE GROUP SECRETS

[module_groups.secrets]
name = "Secrets"
enabled = true
modules = ["pass"]

